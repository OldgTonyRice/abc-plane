services:
  web:
    image: node:22-bullseye
    working_dir: /srv/app
    volumes:
      - ./frontend:/srv/app:rw
    env_file:
      - ./plane.env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    command: ["sh","-lc","ln -sfn /srv/app/.next /srv/app/apps/web/.next && exec node apps/web/server.js"]
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
