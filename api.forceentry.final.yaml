services:
  api:
    command: []
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -e
        cd /code
        python manage.py migrate
        : $${GUNICORN_WORKERS:=2}
        exec gunicorn -k uvicorn.workers.UvicornWorker plane.asgi:application \
             --bind 0.0.0.0:8000 \
             --workers "$${GUNICORN_WORKERS}" \
             --timeout 120
    restart: unless-stopped
